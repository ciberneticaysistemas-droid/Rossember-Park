name: Deploy Rossember Park a GitHub Pages

on:
  push:
    branches:
      - main  # Se activa al hacer push a la rama main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rossember-park-motor-tesserac-prueba_1/package-lock.json

      - name: Instalar dependencias
        working-directory: rossember-park-motor-tesserac-prueba_1
        run: npm install

      - name: Construir la aplicación
        working-directory: rossember-park-motor-tesserac-prueba_1
        env:
          # Las claves se configuran en GitHub → Settings → Secrets and variables → Actions
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_ADMIN_USERNAME: ${{ secrets.VITE_ADMIN_USERNAME }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_WOMPI_PUBLIC_KEY: ${{ secrets.VITE_WOMPI_PUBLIC_KEY }}
          VITE_N8N_WEBHOOK_URL: ${{ secrets.VITE_N8N_WEBHOOK_URL }}
        run: npm run build

      - name: Subir artefacto de páginas
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'rossember-park-motor-tesserac-prueba_1/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
